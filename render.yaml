services:
  # Serviço de banco de dados PostgreSQL
  - type: pserv
    name: lab-scheduler-db
    env: docker
    plan: free
    region: oregon
    
  # Serviço web principal
  - type: web
    name: lab-scheduler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py src.main:app
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeploy: false  # Evita deploys automáticos desnecessários
    envVars:
      - key: FLASK_SECRET_KEY
        value: a_very_strong_random_secret_key_prod_456!@#
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: lab-scheduler-db
          property: connectionString
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: true
      - key: MAIL_USERNAME
        value: itvdslab@gmail.com
      - key: MAIL_PASSWORD
        value: cast qddf bxby mwsl
      - key: MAIL_DEFAULT_SENDER
        value: LAB.ITV
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /opt/render/project/src
