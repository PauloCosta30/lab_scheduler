<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Laboratório v2</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header-container">
            <img src="/static/images/itv_logo.jfif" alt="Logo ITV" id="appLogo">
            <h1>Escala para uso dos laboratórios - ITV</h1>
        </div>

        <!-- Status da Janela de Agendamento -->
        <div class="booking-status-container">
            <h3>Status do Agendamento</h3>
            <div id="bookingStatusMessage" class="status-message">
                Carregando status...
            </div>
        </div>

        <div class="schedule-container">
            <h2>Escala Semanal</h2>
            
            <!-- Barra de Navegação de Semana -->
            <div class="week-navigation">
                <button id="prevWeekButton" title="Ir para a semana anterior">&lt; Semana Anterior</button>
                <div class="date-selector-container">
                    <label for="weekSelector">Ir para a semana de:</label>
                    <input type="date" id="weekSelector">
                    <button id="loadScheduleButton">Carregar</button>
                </div>
                <button id="nextWeekButton" title="Ir para a próxima semana">Próxima Semana &gt;</button>
            </div>

            <p>Clique nos horários disponíveis na tabela para selecioná-los. Após selecionar, clique em "Prosseguir com Agendamento".</p>
            <div id="scheduleTableContainer">
                <!-- Tabela da escala será gerada aqui -->
            </div>
            <div id="scheduleMessage" class="message"></div>
            <div class="action-buttons">
                <button id="proceedToBookingButton" disabled>Prosseguir com Agendamento</button>
                <button id="generatePdfButton" disabled>Gerar PDF da Escala</button>
            </div>
        </div>

        <!-- Modal de Agendamento -->
        <div id="bookingModal" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Confirmar Agendamento</h2>
                <div id="selectedSlotsSummary">
                    <p><strong>Horários Selecionados:</strong></p>
                    <ul>
                        <!-- Lista de horários selecionados será populada aqui -->
                    </ul>
                </div>
                <form id="modalBookingForm">
                    <div>
                        <label for="modalUserName">Nome do Usuário:</label>
                        <input type="text" id="modalUserName" name="userName" required>
                    </div>
                    <div>
                        <label for="modalUserEmail">E-mail do Usuário:</label>
                        <input type="email" id="modalUserEmail" name="userEmail" required>
                    </div>
                    <div>
                        <label for="modalCoordinatorName">Nome do Coordenador:</label>
                        <input type="text" id="modalCoordinatorName" name="coordinatorName" required>
                    </div>
                    <div>
                        <label for="modalObservation">Observação do Agendamento:</label>
                        <textarea id="modalObservation" name="observation" rows="3" placeholder="Digite aqui qualquer observação sobre o agendamento (opcional)"></textarea>
                    </div>
                    <button type="submit">Confirmar e Agendar</button>
                </form>
                <div id="modalFormMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>

    <!-- Link de Login de Administrador -->
    <div class="admin-login-container">
        <a href="#" id="adminLoginLink">Login de Administrador</a>
    </div>
</body>
</html>
